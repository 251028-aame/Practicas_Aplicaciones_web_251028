<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MecaGest: Formulario de Registro de Nuevos Usuarios - 251028</title>
</head>    
<body>
    <header>
        <h1>MecaGest</h1>
        <h2>Registro de nuevos usuarios</h2>
        <p>Complete los campos para solicitar una cuenta en el sistema.</p>
    </header>

    <main>
        <form action="" method="POST">
            <fieldset>
                <legend>Datos Personales</legend>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Alma Ariadne" required>
                <br>
                <label for="apPaterno">Apellido Paterno:</label>
                <input type="text" id="apPaterno" placeholder="Maldonado" required>
                <br>
            <label for="apMaterno">Apellido Materno:</label>
            <input type="text" id="apMaterno" placeholder="Eslava">
            <br>
            <label for="genero">Genero:</label>
            <select id="genero">
                <option value="F">Femenino</option>
                <option value="M">Masculino</option>
                <option value="X">Prefiero no decirlo</option>
            </select>
            <br>
            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </fieldset>

            <fieldset>  
                <legend>Datos de Contacto</legend>
                <label for="email">Correo Electrònico:</label>
                <input type="email" id="email" name="correo" placeholder="alma@example.com" required>
                <br>
                <label for="phone">Numero de Telefono:</label>
                <input type="phone" id="phone" name="telefono" placeholder="+55 764 121 0192" required>
                <br>
                <label for="horarioContacto">Favor de contactar en el horario:</label>
                <input type="time" id="horarioContactoInicio" placeholder="09:00"> a 
                <input type="time" id="horarioContactOFin" placeholder="18:00">
            </fieldset>

            <fieldset>
                <legend>Datos de Acceso</legend>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" placeholder="ariadnees" required>
                <br>
                <label for="contrasena">Contraseña:</label>
                <input type="passsword" id="contrasena"  placeholder="**********" required>
                <br>
                <label for="confirmarContraseña">Confirmar Contraseña:</label>
                <input type="password" id="ConfirmarContraseña" placeholder="**********">
            </fieldset>

            <fieldset>
                <legend>Datos de Ubicacion</legend>
                <label for="direccion">Direccion:</label>
                <input type="text" id="direccion" placeholder="Calle, Numero, Colonia, Ciudad, Estado, Codigo Postal" required>
                <br>
                <label for="pais">Pais:</label>
                <input type="text" id="pais"  placeholder="Mexico" required>
                <br>
                <label for="estado">Estado:</label>
                <input type="text" id="estado"  placeholder="Ciudad de Mexico" required>
                <br>
                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad"  placeholder="Ciudad de Mexico" required>
                <br>
                <label for="codigoPostal">Codigo Postal:</label>
                <input type="text" id="codigoPostal"  placeholder="73165" required>
            </fieldset>
            <input type="submit" value="Enviar Solicitud">
         </form>
    </main>
</body>
</html>
